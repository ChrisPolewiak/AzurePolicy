parameters:
- name: deploy
  type: boolean
  default: false
- name: location
  type: string
- name: targetAssignment
  type: string

steps:
- task: AzureCLI@2
  displayName: ${{ iif(parameters.deploy, 'Deploy policy assignments', 'What-If policy assignments') }}
  inputs:
    azureSubscription: '$(devops_service_connection_name)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      trap 'rc=$?; echo "##vso[task.logissue type=error]Policy assignment task failed (exit $rc). See the assignment summary or task log for details."; exit "$rc"' ERR
      echo "Azure authenticated context:"
      az account show --query "{tenantId:tenantId, subscriptionId:id, subscriptionName:name}" -o table
      chmod +x scripts/update-assignments.sh
      args=(--location "$POLICY_LOCATION")
      if [[ "$TARGET_ASSIGNMENT" != '*' ]]; then
        args+=(--assignment "$TARGET_ASSIGNMENT")
      fi
      if [[ "$DEPLOY_ASSIGNMENTS" == True || "$DEPLOY_ASSIGNMENTS" == true ]]; then
        args+=(--deploy)
      fi
      scripts/update-assignments.sh "${args[@]}"
  env:
    POLICY_LOCATION: ${{ parameters.location }}
    TARGET_ASSIGNMENT: ${{ parameters.targetAssignment }}
    DEPLOY_ASSIGNMENTS: ${{ parameters.deploy }}
