trigger: none
pr: none

# SETUP (one-time, per ADO project):
#   Copy this file to .pipelines/update-assignments.yml
#   and update the source: field to match the upstream pipeline name registered in ADO.
#   update-assignments.yml is in .gitignore — it stays in your ADO repository only, never on GitHub.
#
#   The source: value defaults to the pipeline name without an environment suffix.
#   If using --name-suffix, append that suffix to the source: value (e.g. -DEV, -PRD).
#   The value must match exactly the ADO pipeline name registered by create-ado-pipelines.sh.
#   Examples:
#     source: B-rebuild-configuration-DEV
#     source: B-rebuild-configuration    (single-env, no suffix)

parameters:
- name: deployMode
  type: string
  default: whatif
  values:
  - whatif
  - deploy
  displayName: 'Mode: whatif = preview only, deploy = preview and deployment'
- name: skipValidation
  type: boolean
  default: false
  displayName: 'Skip the What-If stage (only for deployMode=deploy)'
- name: location
  type: string
  default: germanywestcentral
  displayName: 'Deployment location for tenant deployment metadata'
- name: targetAssignment
  type: string
  default: '*'
  displayName: 'Assignment name to process (* = all)'

resources:
  pipelines:
  - pipeline: rebuild-configuration
    source: B-rebuild-configuration
    trigger: none

variables:
- template: ../configuration/ado-env.yml

pool:
  name: $(devopsManagedPool)

steps:
- checkout: self

- download: rebuild-configuration
  artifact: policy-generated
  displayName: 'Download artifact: policy-generated'

- bash: |
    set -euo pipefail
    cp -r "$(Pipeline.Workspace)/rebuild-configuration/policy-generated/bicep/." bicep/
    cp -r "$(Pipeline.Workspace)/rebuild-configuration/policy-generated/generated/." generated/
  displayName: 'Restore policy-generated artifact to bicep/ and generated/'

- bash: |
    set -euo pipefail
    if [[ -z "$(devopsManagedPool)" ]]; then
      echo "##vso[task.logissue type=error]Missing variable 'devopsManagedPool' in configuration/ado-env.yml."
      exit 1
    fi
    if [[ -z "$(serviceConnectionName)" ]]; then
      echo "##vso[task.logissue type=error]Missing variable 'serviceConnectionName' in configuration/ado-env.yml."
      exit 1
    fi
    echo "Variable precheck passed."
  displayName: 'Precheck required Library variables'

- ${{ if or(eq(parameters.deployMode, 'whatif'), not(parameters.skipValidation)) }}:
  - template: .templates/update-assignments-step.yml
    parameters:
      location: ${{ parameters.location }}
      targetAssignment: ${{ parameters.targetAssignment }}

- ${{ if eq(parameters.deployMode, 'deploy') }}:
  - template: .templates/update-assignments-step.yml
    parameters:
      deploy: true
      location: ${{ parameters.location }}
      targetAssignment: ${{ parameters.targetAssignment }}

- bash: |
    set -euo pipefail
    rm -rf bicep/policyDefinitions bicep/policySetDefinitions
    rm -f generated/initiatives.json generated/assignments.json generated/parameters.json generated/assignment-identities.json
    rm -rf "$(Pipeline.Workspace)/rebuild-configuration"
  displayName: 'Cleanup workspace'
  condition: always()
