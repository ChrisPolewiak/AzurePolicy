trigger: none
pr: none

parameters:
- name: policyVersion
  type: string
  default: 'main'
  displayName: 'Azure Policy version (tag or commit SHA from Azure/Enterprise-Scale)'

resources:
  pipelines:
  - pipeline: fetch-policies
    source: fetch-policies
    trigger: none

variables:
- template: ../configuration/ado-env.yml

pool:
  name: $(devopsManagedPool)

steps:
- checkout: self
  persistCredentials: false

- download: fetch-policies
  artifact: policy-source
  displayName: 'Download artifact: policy-source'

- bash: |
    set -euo pipefail
    # Artefakt pobierany jest do $(Pipeline.Workspace)/fetch-policies/policy-source
    # Kopiujemy do source/ żeby skrypt widział go we właściwym miejscu
    mkdir -p source
    cp -r "$(Pipeline.Workspace)/fetch-policies/policy-source/." source/
    echo "Snapshot version: $(cat source/.snapshot-version)"
  displayName: 'Restore policy-source artifact to source/'

- bash: |
    set -euo pipefail
    chmod +x scripts/rebuild-configuration.sh
    scripts/rebuild-configuration.sh
  displayName: 'Rebuild configuration (generate ARM JSON + config JSON + validate)'

- bash: |
    set -euo pipefail
    mkdir -p "$(Build.ArtifactStagingDirectory)/bicep"
    mkdir -p "$(Build.ArtifactStagingDirectory)/generated"
    cp -r bicep/policyDefinitions/    "$(Build.ArtifactStagingDirectory)/bicep/policyDefinitions/"
    cp -r bicep/policySetDefinitions/ "$(Build.ArtifactStagingDirectory)/bicep/policySetDefinitions/"
    cp generated/initiatives.json        "$(Build.ArtifactStagingDirectory)/generated/"
    cp generated/assignments.json        "$(Build.ArtifactStagingDirectory)/generated/"
    cp generated/parameters.json         "$(Build.ArtifactStagingDirectory)/generated/"
    cp generated/assignment-identities.json "$(Build.ArtifactStagingDirectory)/generated/"
  displayName: 'Stage generated files for artifact'

- publish: $(Build.ArtifactStagingDirectory)
  artifact: policy-generated
  displayName: 'Publish artifact: policy-generated'

- bash: |
    set -euo pipefail
    rm -rf source
    rm -rf bicep/policyDefinitions bicep/policySetDefinitions
    rm -f generated/initiatives.json generated/assignments.json generated/parameters.json generated/assignment-identities.json
    rm -rf "$(Build.ArtifactStagingDirectory)/bicep" "$(Build.ArtifactStagingDirectory)/generated"
    rm -rf "$(Pipeline.Workspace)/fetch-policies"
  displayName: 'Cleanup workspace and staging'
  condition: always()

