trigger: none
pr: none

parameters:
- name: frameworkVersion
  type: string
  default: 'main'
  displayName: 'Framework version (tag or branch) from GitHub'
- name: dryRun
  type: boolean
  default: true
  displayName: 'Dry run (preview changes without committing)'

variables:
- group: 'AzureDevOps'

pool:
  name: $(devopsManagedPool)

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- bash: |
    set -euo pipefail

    echo "##[section]Cloning framework from GitHub (version: ${{ parameters.frameworkVersion }})"

    git clone \
      --depth 1 \
      --branch "${{ parameters.frameworkVersion }}" \
      "$(githubFrameworkUrl)" \
      _framework_tmp

    echo "##[section]Syncing framework files (excluding local overrides)"

    rsync -av \
      --exclude='.git/' \
      --exclude='configurations/' \
      --exclude='source/own/' \
      --exclude='scripts/deployment-config.json' \
      --exclude='docs/*.tsv' \
      --exclude='docs/*.csv' \
      --exclude='docs/*.xlsx' \
      --exclude='docs/*.xls' \
      _framework_tmp/ ./

    echo "##[section]Cleanup temp clone"
    rm -rf _framework_tmp

    echo "##[section]Changes after sync:"
    git status
    git diff --stat HEAD
  displayName: 'Sync framework from GitHub'

- bash: |
    set -euo pipefail

    if git diff --quiet HEAD && git diff --cached --quiet; then
      echo "##[warning]No changes detected — framework is already up to date."
      exit 0
    fi

    echo "##[section]Committing sync"
    git config user.email "$(Build.RequestedForEmail)"
    git config user.name "$(Build.RequestedFor)"

    git add -A
    git commit -m "chore: sync framework ${{ parameters.frameworkVersion }} from GitHub [skip ci]"
    git push origin HEAD:$(Build.SourceBranchName)

    echo "##[section]Sync committed and pushed."
  displayName: 'Commit and push sync to ADO'
  condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'false'))

- bash: |
    echo "##[warning]Dry run mode — changes were NOT committed."
    echo "Run with dryRun=false to apply."
    git status
    git diff HEAD
  displayName: 'Dry run summary (no commit)'
  condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'true'))
