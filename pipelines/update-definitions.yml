trigger: none
pr: none

parameters:
- name: location
  type: string
  default: germanywestcentral
  displayName: 'Deployment location for deployment metadata'
- name: targetInitiative
  type: string
  default: '*'
  displayName: 'Initiative name to deploy (* = all)'
- name: targetDefinition
  type: string
  default: '*'
  displayName: 'Policy definition name to deploy (* = all)'
- name: deployPolicyDefinitions
  type: boolean
  default: true
  displayName: 'Deploy policy definitions phase'
- name: deployInitiatives
  type: boolean
  default: true
  displayName: 'Deploy initiative definitions phase'

resources:
  pipelines:
  - pipeline: rebuild-configuration
    source: rebuild-configuration
    trigger: none

variables:
- template: ../configuration/ado-env.yml

pool:
  name: $(devopsManagedPool)

steps:
- checkout: self
  persistCredentials: false

- download: rebuild-configuration
  artifact: policy-generated
  displayName: 'Download artifact: policy-generated'

- bash: |
    set -euo pipefail
    cp -r "$(Pipeline.Workspace)/rebuild-configuration/policy-generated/bicep/." bicep/
    cp -r "$(Pipeline.Workspace)/rebuild-configuration/policy-generated/generated/." generated/
  displayName: 'Restore policy-generated artifact to bicep/ and generated/'

- bash: |
    set -euo pipefail
    if [[ -z "$(devopsManagedPool)" ]]; then
      echo "ERROR: Missing variable 'devopsManagedPool' in configuration/ado-env.yml."
      exit 1
    fi
    if [[ -z "$(serviceConnectionName)" ]]; then
      echo "ERROR: Missing variable 'serviceConnectionName' in configuration/ado-env.yml."
      exit 1
    fi
    echo "Variable precheck passed."
  displayName: 'Precheck required Library variables'

- task: AzureCLI@2
  displayName: 'Deploy initiative definitions to Management Group'
  inputs:
    azureSubscription: '$(serviceConnectionName)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      echo "Azure authenticated context:"
      az account show --query "{tenantId:tenantId, subscriptionId:id, subscriptionName:name}" -o table

      chmod +x scripts/update-definitions.sh
      args=(
        --location '${{ parameters.location }}'
      )

      if [[ '${{ parameters.targetInitiative }}' != '*' ]]; then
        args+=(--initiative '${{ parameters.targetInitiative }}')
      fi

      if [[ '${{ parameters.targetDefinition }}' != '*' ]]; then
        args+=(--definition '${{ parameters.targetDefinition }}')
      fi

      if [[ '${{ parameters.deployPolicyDefinitions }}' != 'True' ]]; then
        args+=(--skip-definitions)
      fi

      if [[ '${{ parameters.deployInitiatives }}' != 'True' ]]; then
        args+=(--skip-initiatives)
      fi

      scripts/update-definitions.sh "${args[@]}"

- bash: |
    set -euo pipefail
    rm -rf bicep/policyDefinitions bicep/policySetDefinitions
    rm -f generated/initiatives.json generated/assignments.json generated/parameters.json generated/assignment-identities.json
    rm -rf "$(Pipeline.Workspace)/rebuild-configuration"
  displayName: 'Cleanup workspace'
  condition: always()
