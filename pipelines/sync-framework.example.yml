trigger: none
pr: none

# SETUP (one-time, per ADO project):
#   Copy this file to pipelines/sync-framework.yml and set your GitHub service connection name.
#   sync-framework.yml is in .gitignore — it stays local in your ADO repository, never on GitHub.
#
# WHY: resources: is evaluated at compile time — $(variables) and ${{ parameters }} are not allowed
#   in the endpoint field. The service connection name must be a literal string.

parameters:
- name: frameworkVersion
  type: string
  default: 'main'
  displayName: 'Framework version (tag or branch) from GitHub'
- name: dryRun
  type: boolean
  default: true
  displayName: 'Dry run (preview changes without committing)'

resources:
  repositories:
  - repository: framework
    type: github
    endpoint: <YOUR_GITHUB_SERVICE_CONNECTION_NAME>  # TODO: replace with your GitHub service connection name
    name: ChrisPolewiak/AzurePolicy                # GitHub repo (org/repo)
    ref: refs/heads/main                           # Default ref — overridden at runtime by frameworkVersion

variables:
- template: ../configuration/ado-env.yml

pool:
  name: $(devopsManagedPool)

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- checkout: framework
  path: _framework_tmp

- bash: |
    set -euo pipefail

    echo "##[section]Syncing framework files (excluding local overrides)"

    rsync -av \
      --exclude='.git/' \
      --exclude='.gitignore' \
      --exclude='configurations/' \
      --exclude='source/own/' \
      --exclude='scripts/deployment-config.json' \
      --exclude='docs/*.tsv' \
      --exclude='docs/*.csv' \
      --exclude='docs/*.xlsx' \
      --exclude='docs/*.xls' \
      --exclude='pipelines/fetch-policies.yml' \
      --exclude='pipelines/sync-framework.yml' \
      --exclude='pipelines/rebuild-configuration.yml' \
      --exclude='pipelines/update-definitions.yml' \
      --exclude='pipelines/update-assignments.yml' \
      --exclude='pipelines/cleanup.yml' \
      $(Agent.BuildDirectory)/_framework_tmp/ $(Build.SourcesDirectory)/$(Build.Repository.Name)/

    echo "##[section]Changes after sync:"
    git -C "$(Build.SourcesDirectory)/$(Build.Repository.Name)" status
    git -C "$(Build.SourcesDirectory)/$(Build.Repository.Name)" diff --stat HEAD
  displayName: 'Sync framework from GitHub'

- bash: |
    set -euo pipefail

    if git diff --quiet HEAD && git diff --cached --quiet; then
      echo "##[warning]No changes detected — framework is already up to date."
      exit 0
    fi

    echo "##[section]Committing sync"
    git config user.email "$(Build.RequestedForEmail)"
    git config user.name "$(Build.RequestedFor)"

    git add -A
    git commit -m "chore: sync framework ${{ parameters.frameworkVersion }} from GitHub [skip ci]"
    git push origin HEAD:$(Build.SourceBranchName)

    echo "##[section]Sync committed and pushed."
  workingDirectory: $(Build.SourcesDirectory)/$(Build.Repository.Name)
  displayName: 'Commit and push sync to ADO'
  condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'false'))

- bash: |
    echo "##[warning]Dry run mode — changes were NOT committed."
    echo "Run with dryRun=false to apply."
    git status
    git diff HEAD
  workingDirectory: $(Build.SourcesDirectory)/$(Build.Repository.Name)
  displayName: 'Dry run summary (no commit)'
  condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'true'))
